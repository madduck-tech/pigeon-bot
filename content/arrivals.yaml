# Arrival phrases. {name} is the pigeon's name, always in the nominative case.
- Голубь {name} прилетел, курлык.
- Голубь {name} прилетел на подоконник. Курлык!
- Курлык! На подоконник сел голубь {name}.
- Голубятня выпустила птицу. Это голубь {name}. Курлык.
- Голубь {name} на районе. Курлык-курлык.
- Голубь {name} присел на карниз и смотрит на вас. Курлык.
- Из голубятни вылетел голубь {name}. Просит семечек. Курлык.
- Голубь {name} зашёл на подоконник как к себе домой. Курлык.
- Курлык-курлык. Голубь {name} снова в деле.
- Голубь {name} поправил кепку и сел на подоконник. Курлык.
- На карнизе шорох. Это голубь {name}, курлык.
- Голубь {name} прилетел по делам. По каким, не говорит. Курлык.
