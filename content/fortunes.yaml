- id: seeds-fall
  format: classic
  text: Сегодня семечки упадут в твою сторону.
- id: pigeon-saw-future
  format: classic
  text: Голубь видел твоё будущее. Просил передать, что там нормально.
- id: avoid-cornice
  format: classic
  text: Не ходи сегодня под карнизом. Просто поверь.
- id: find-unlost
  format: classic
  text: К вечеру найдёшь то, что не терял.
- id: windowsill-check
  format: classic
  text: День хороший. Голубь проверил с подоконника.
- id: early-riser
  format: classic
  text: Кто рано встаёт, тому голубь уже всё рассказал.
- id: crows-argument
  format: classic
  text: Сегодня лучше не спорить с воронами.
- id: shining-chain
  format: classic
  text: Твоя цепь сегодня блестит ярче обычного.
- id: yard-reputation
  format: classic
  text: На районе про тебя говорят только хорошее. Голубь подтвердил.
- id: important-crumb
  format: classic
  text: Крошка хлеба сегодня окажется важнее, чем кажется.
- id: hold-cap
  format: classic
  text: Ветер попутный, но кепку придержи.
- id: confident-squat
  format: classic
  text: 'Сиди на корточках уверенно: сегодня твой день.'
- id: silent-pigeon
  format: classic
  text: Голубь молчит. Это хороший знак.
- id: stars-unaware
  format: classic
  text: 'Звёзды не в курсе, а голубь в курсе: всё будет чётко.'
- id: avoid-puddle
  format: classic
  text: Обойди лужу. Потом скажешь спасибо.
- id: kind-memory
  format: classic
  text: Сегодня кто-то вспомнит про тебя добрым словом и кривым почерком.
- id: luck-branch
  format: classic
  text: Удача сидит на соседней ветке. Не спугни.
- id: another-windowsill
  format: classic
  text: Если день не задался, просто перелети на другой подоконник.
- id: pigeon-mail
  format: classic
  text: Голубиная почта задерживается, но хорошие новости уже в пути.
- id: bird-authority
  format: classic
  text: Сегодня ты в авторитете у всех птиц двора.
- id: weekly-money
  format: classic
  text: На этой неделе деньги есть. Голубь не уточнил, у кого.
- id: golden-spit
  format: classic
  text: Не всё то золото, что Золотой плевок. Но многое.
- id: yard-alliance
  format: classic
  text: Двор на твоей стороне. По крайней мере, его голубиная часть.
- id: tracksuit-fit
  format: classic
  text: Сегодня твой спортивный костюм сядет идеально.
- id: no-rush
  format: classic
  text: Не торопись. Голубь никуда не спешит, и у него всё нормально.
- id: extra-seeds
  format: classic
  text: Сегодня лучше взять ещё семечек. Интуиция голубя.
- id: bench-seat
  format: classic
  text: Кто-то сегодня уступит тебе лавочку.
- id: go-outside
  format: classic
  text: Голубь советует выйти на улицу. Голубь вообще других советов не знает.
- id: open-windowsill
  format: classic
  text: Подоконник твоей судьбы открыт и хорошо проветривается.
- id: same-pigeon
  format: classic
  text: Завтра будет как сегодня, только с другим голубем. Шутка, голубь тот же.
- id: shadow-turn
  format: omen
  text: Если тень повернула за угол раньше тебя, то день приготовил неожиданный поворот.
- id: bell-ring
  format: omen
  text: Если у подъезда звякнул ключ, то найдётся решение старой задачи.
- id: leaf-spin
  format: omen
  text: Если лист закрутился волчком, то скучному плану пора дать ходу.
- id: chalk-mark
  format: omen
  text: Если мел на асфальте нарисовал стрелку, то выбирай дорогу смелее.
- id: gate-creak
  format: omen
  text: Если калитка скрипнула дважды, то давний разговор пойдёт на лад.
- id: cloud-gap
  format: omen
  text: Если в тучах открылось окно, то и у твоего дела появится шанс.
- id: puddle-ripple
  format: omen
  text: Если по луже пошли круги, то маленькая идея разойдётся по всему району.
- id: awning-flap
  format: omen
  text: Если козырёк хлопнул от ветра, то пора закрыть одно дело и открыть другое.
- id: scene-bench
  format: scene
  text: '{name} занял край лавочки и оставил середину свободной. Во дворе сегодня место найдётся каждому.'
- id: scene-roof
  format: scene
  text: '{name} оглядел крыши и выбрал самую тихую. Тебе тоже пригодится час без суеты.'
- id: scene-map
  format: scene
  text: '{name} изучил трещины на асфальте как карту. Неожиданный маршрут приведёт к хорошей находке.'
- id: scene-seed
  format: scene
  text: '{name} спрятал семечку про запас. Сегодня предусмотрительность будет главным козырем.'
- id: scene-rain
  format: scene
  text: '{name} переждал дождь под навесом и вышел первым. Терпение даст тебе фору.'
- id: scene-parade
  format: scene
  text: '{name} прошёл по бордюру как по красной дорожке. Смело показывай результат своей работы.'
- id: spread-work
  format: spread
  text: |-
    Удача: дело сдвинется с места.
    Опасность: взяться за всё сразу.
    Совет: выбери одну задачу и дожми.
- id: spread-talk
  format: spread
  text: |-
    Удача: нужные слова найдутся вовремя.
    Опасность: перебить на полуслове.
    Совет: сначала выслушай весь расклад.
- id: spread-route
  format: spread
  text: |-
    Удача: короткий путь окажется открытым.
    Опасность: проскочить нужный поворот.
    Совет: сверяйся с планом на ходу.
- id: spread-rest
  format: spread
  text: |-
    Удача: свободный час сам постучит в дверь.
    Опасность: забить его мелочами.
    Совет: устрой себе законный привал.
- id: spread-idea
  format: spread
  text: |-
    Удача: свежая мысль залетит с утра.
    Опасность: забыть её к обеду.
    Совет: запиши, пока не улетела.
- id: spread-team
  format: spread
  text: |-
    Удача: союзники подтянутся к делу.
    Опасность: всем схватиться за один конец.
    Совет: разделите работу по силам.
- id: chat-project
  format: chat
  text: 'Районный прогноз: общее дело пойдёт бодрее, если каждый возьмёт свой участок.'
- id: chat-joke
  format: chat
  text: В чате назревает шутка дня. Берегите её от плохого настроения.
- id: chat-answer
  format: chat
  text: Сегодня чей-то вопрос откроет полезный разговор для всего двора.
- id: chat-pause
  format: chat
  text: 'Чату положена передышка: после неё даже сложная тема зайдёт легче.'
- id: chat-discovery
  format: chat
  text: В районе скоро найдут любопытную штуку. Делитесь находкой с остальными.
- id: chat-tradition
  format: chat
  text: У чата есть шанс завести новую добрую традицию. Начать можно с малого.
