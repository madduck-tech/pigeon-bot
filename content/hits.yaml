normal:
  - "точно в цель! Голубь удивлён."
  - "попадание по голубю! Тот поправил перья."
  - "меткое попадание! Голубь отступил на шаг."
  - "точный плевок по голубю! Тот встряхнулся."
  - "попадание без замаха! Голубь покосился на двор."
  - "точно с первого раза! Голубь качнул головой."
miss:
  - "мимо. Голубь даже не моргнул."
  - "промах: плевок приземлился рядом."
  - "плевок мимо. Голубь остался сухим."
  - "мимо голубя: ветер увёл плевок в сторону."
  - "промах по цели. Голубь спокойно переступил на месте."
  - "плевок в лужу, голубь не задет."
cap:
  - "прямо в кепку голубя! Вот это меткость."
  - "плевком в козырёк кепки! Голубь аж присел."
  - "метко в кепку! Она съехала набок."
  - "плевком по кепке голубя! Тот поправил козырёк."
  - "точно в макушку кепки! Голубь озадачен."
  - "плевком в край кепки! Голубь удержал её крылом."
chain:
  - "попадание в голубя, а брызги задели его цепь! Двор впечатлён."
  - "метко по голубю и его цепи! Двойной расклад."
  - "точно в цель с рикошетом по цепи! Голубь проверяет украшение."
  - "попадание в голубя, и брызги сверкнули на цепи! Красивый заход."
  - "плевком по голубю и цепи! Та блестит ещё ярче."
  - "одним плевком по голубю и его цепи! Вот это размах."
cap_knocked:
  - "кепка голубя сбита! Сам голубь остался невредим."
  - "плевком в кепку: она сбита! Голубь всё ещё на месте."
  - "кепка слетела от плевка! До голубя очередь не дошла."
  - "кепка вместе с козырьком сбита! Голубь встряхнулся и остался."
